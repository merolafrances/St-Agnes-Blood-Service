<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الخدام</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
        <span class="text-3xl">🩸</span>
      </div>

      <h1 class="text-2xl font-bold text-slate-800">
        خدمة الشهيدة أجنس للتبرع بالدم
      </h1>

      <p class="text-slate-500 mt-2">
        بوابة الخدام
      </p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-lg p-6">

      <!-- Phase 1 -->
      <div id="gatewaySection">

        <div class="text-center mb-6">
          <div class="text-4xl mb-3">🔒</div>

          <h2 class="text-xl font-bold text-slate-800">
            الدخول إلى بوابة الخدام
          </h2>

          <p class="text-sm text-slate-500 mt-2">
            أدخل كود الدخول للمتابعة
          </p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">
            كود الدخول
          </label>

          <input
            id="gatewayCode"
            type="password"
            inputmode="numeric"
            class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="أدخل الكود"
          >

          <p id="gatewayError" class="hidden text-red-500 text-sm mt-2">
            كود الدخول غير صحيح
          </p>

          <button
            onclick="checkGatewayCode()"
            class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition"
          >
            متابعة
          </button>
        </div>

      </div>


      <!-- Phase 2 -->
      <div id="loginSection" class="hidden">

        <div class="text-center mb-6">
          <div class="text-4xl mb-3">👋</div>

          <h2 class="text-xl font-bold text-slate-800">
            تسجيل الدخول
          </h2>

          <p class="text-sm text-slate-500 mt-2">
            أهلاً بيك، سجل دخولك للمتابعة
          </p>
        </div>

        <div class="space-y-4">

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
              اسم الخادم
            </label>

            <input
              id="loginName"
              type="text"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400"
              placeholder="اكتب اسمك"
            >
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
              كلمة المرور
            </label>

            <input
              id="loginPassword"
              type="password"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400"
              placeholder="أدخل كلمة المرور"
            >
          </div>

          <p id="loginError" class="hidden text-red-500 text-sm">
            اسم الخادم أو كلمة المرور غير صحيحة
          </p>

          <button
            onclick="login()"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition"
          >
            تسجيل الدخول
          </button>

        </div>


        <!-- Register -->
        <div class="mt-6 pt-5 border-t border-slate-100 text-center">

          <p class="text-sm text-slate-500 mb-2">
            أول مرة تدخل؟
          </p>

          <button
            onclick="showRegister()"
            class="text-blue-600 hover:text-blue-700 font-semibold text-sm"
          >
            إنشاء حساب جديد
          </button>

        </div>

      </div>


      <!-- Register Section -->
      <div id="registerSection" class="hidden">

        <div class="text-center mb-6">
          <div class="text-4xl mb-3">📝</div>

          <h2 class="text-xl font-bold text-slate-800">
            إنشاء حساب جديد
          </h2>

          <p class="text-sm text-slate-500 mt-2">
            أنشئ حسابك للدخول إلى بوابة الخدام
          </p>
        </div>

        <div class="space-y-4">

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
              اسم الخادم
            </label>

            <input
              id="registerName"
              type="text"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400"
              placeholder="اكتب اسمك"
            >
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
              كلمة المرور
            </label>

            <input
              id="registerPassword"
              type="password"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400"
              placeholder="أنشئ كلمة مرور"
            >
          </div>

          <p id="registerError" class="hidden text-red-500 text-sm"></p>

          <button
            onclick="register()"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition"
          >
            إنشاء الحساب
          </button>

        </div>

        <div class="mt-6 pt-5 border-t border-slate-100 text-center">

          <button
            onclick="showLogin()"
            class="text-blue-600 hover:text-blue-700 font-semibold text-sm"
          >
            العودة لتسجيل الدخول
          </button>

        </div>

      </div>

    </div>

  </div>


  <script>

    // ==============================
    // Gateway Code
    // ==============================

    function checkGatewayCode() {

      const code =
        document.getElementById("gatewayCode").value.trim();

      const error =
        document.getElementById("gatewayError");


      // Admin code
      if (code === "987654321") {

        error.classList.add("hidden");

        window.location.href = "/admin-panel";

        return;
      }


      // Servants code
      if (code === "2112021") {

        error.classList.add("hidden");

        document
          .getElementById("gatewaySection")
          .classList
          .add("hidden");

        document
          .getElementById("loginSection")
          .classList
          .remove("hidden");

      } else {

        error.classList.remove("hidden");

      }

    }



    // ==============================
    // Login
    // ==============================

    async function login() {

      const name =
        document
          .getElementById("loginName")
          .value
          .trim();


      const password =
        document
          .getElementById("loginPassword")
          .value;


      const error =
        document.getElementById("loginError");


      error.classList.add("hidden");


      if (!name || !password) {

        error.textContent =
          "من فضلك أدخل اسم الخادم وكلمة المرور";

        error.classList.remove("hidden");

        return;
      }


      try {

        const response =
          await fetch("/api/login", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              username: name,

              password: password

            })

          });


        let data = {};

        try {

          data = await response.json();

        } catch (jsonError) {

          data = {};

        }


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.detail ||
            "اسم الخادم أو كلمة المرور غير صحيحة"
          );

        }


        // ==============================
        // Save Logged-in User
        // ==============================

        // الاسم الأساسي الذي سيستخدمه النظام
        const loggedInUsername =
          data.username ||
          (data.user && data.user.username) ||
          name;


        // حفظ اسم الخادم مباشرة
        // وهذا هو المفتاح الذي تستخدمه صفحة index.html
        localStorage.setItem(
          "username",
          loggedInUsername
        );


        // حفظ بيانات المستخدم أيضًا
        // لأن بعض أجزاء index.html تعتمد على "user"
        const savedUser =
          data.user ||
          {
            username: loggedInUsername
          };


        localStorage.setItem(
          "user",
          JSON.stringify(savedUser)
        );


        // التأكد أن البيانات اتخزنت بالفعل
        const savedUsername =
          localStorage.getItem("username");


        if (!savedUsername) {

          throw new Error(
            "تعذر حفظ بيانات تسجيل الدخول في المتصفح."
          );

        }


        // ==============================
        // Go To Servants Page
        // ==============================

        window.location.replace("/index");


      } catch (err) {

        console.error(
          "Login error:",
          err
        );

        error.textContent =
          err.message ||
          "حدث خطأ أثناء تسجيل الدخول";

        error.classList.remove("hidden");

      }

    }



    // ==============================
    // Show Register
    // ==============================

    function showRegister() {

      document
        .getElementById("loginSection")
        .classList
        .add("hidden");


      document
        .getElementById("registerSection")
        .classList
        .remove("hidden");

    }



    // ==============================
    // Show Login
    // ==============================

    function showLogin() {

      document
        .getElementById("registerSection")
        .classList
        .add("hidden");


      document
        .getElementById("loginSection")
        .classList
        .remove("hidden");

    }



    // ==============================
    // Register
    // ==============================

    async function register() {

      const name =
        document
          .getElementById("registerName")
          .value
          .trim();


      const password =
        document
          .getElementById("registerPassword")
          .value;


      const error =
        document.getElementById("registerError");


      error.classList.add("hidden");


      if (!name || !password) {

        error.textContent =
          "من فضلك أدخل اسم الخادم وكلمة المرور";

        error.classList.remove("hidden");

        return;
      }


      try {

        const response =
          await fetch("/api/register", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              username: name,

              password: password

            })

          });


        let data = {};

        try {

          data = await response.json();

        } catch (jsonError) {

          data = {};

        }


        if (
          response.ok &&
          data.status === "success"
        ) {

          alert(
            "تم إنشاء الحساب بنجاح"
          );


          document
            .getElementById("registerName")
            .value = "";


          document
            .getElementById("registerPassword")
            .value = "";


          showLogin();


        } else {

          error.textContent =
            data.detail ||
            data.message ||
            "تعذر إنشاء الحساب";

          error.classList.remove("hidden");

        }


      } catch (err) {

        console.error(
          "Register error:",
          err
        );


        error.textContent =
          "حدث خطأ في الاتصال بالسيرفر";

        error.classList.remove("hidden");

      }

    }



    // ==============================
    // Enter - Gateway
    // ==============================

    document
      .getElementById("gatewayCode")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            checkGatewayCode();

          }

        }
      );



    // ==============================
    // Enter - Login
    // ==============================

    document
      .getElementById("loginPassword")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            login();

          }

        }
      );



    // ==============================
    // Enter - Register
    // ==============================

    document
      .getElementById("registerPassword")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            register();

          }

        }
      );



    // ==============================
    // Prevent Accidental Form Submit
    // ==============================

    document.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

      }
    );

  </script>

</body>
</html>
